; Installed by install-pikrellcam.sh.
; PiKrellCam takes no file uploads.  Turning off upload handling also
; reduces exposure to PHP request-parsing vulnerabilities such as
; CVE-2026-109618.  This does not replace installing PHP security updates.
file_uploads = Off
session.upload_progress.enabled = Off
post_max_size = 1M
expose_php = Off
